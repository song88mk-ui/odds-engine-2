name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR: 418541840646.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build:
    name: Build ${{ matrix.app.path }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        app:
          - path: OE.Adapter.Service
            image: oev2-adapter-service
          - path: OE.Sportsbook.Service
            image: oev2-sportsbook-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Affected files
        id: app-changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
        with:
          files: 'src/OddsEngine/${{ matrix.app.path }}/**'

      - name: Changes Check
        id: proceed
        if: steps.app-changes.outputs.any_changed == 'true'
        run: |
          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: Docker meta
        if: steps.proceed.outputs.proceed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.ECR }}/${{ matrix.app.image }}
          tags: |
            type=sha,event=pr,prefix=pr-sha-
            type=sha,event=branch,prefix={{branch}}-sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Setup Docker Buildx
        if: steps.proceed.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: steps.proceed.outputs.proceed == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::418541840646:role/github-oidc-ecr-push-role

      - name: Login to Amazon ECR
        if: steps.proceed.outputs.proceed == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        if: steps.proceed.outputs.proceed == 'true'
        uses: docker/build-push-action@v6
        with:
          file: src/OddsEngine/${{ matrix.app.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Logout to Amazon ECR
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
