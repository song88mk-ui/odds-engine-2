name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types:
      - released

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.project }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - OE.Shared.Test
          - OE.Adapter.Service.Tests
          - OE.Sportsbook.Service.Tests
          - OE.Translation.Service.Tests
          - OE.Translation.Job.Tests
          - OE.Websocket.Service.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Add NuGet source
        run: |
          dotnet nuget add source --username FlyingCockatoo --password ${{ secrets.NUGET_PASSWORD }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/FlyingCockatoo/index.json"

      - name: Test ${{ matrix.project }}
        run: dotnet test src/OddsEngine/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release

  build:
    name: Build ${{ matrix.app.path }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        app:
          - path: OE.Adapter.Service
            image: oev2-adapter-service
          - path: OE.Sportsbook.Service
            image: oev2-sportsbook-service
          - path: OE.Websocket.Service
            image: oev2-websocket-service
          - path: OE.UOF.Client
            image: oev2-uof-client
          - path: OE.Job.KeepAlive
            image: oev2-job-keepalive
          - path: OE.Job.Settlement
            image: oev2-job-settlement
          - path: OE.Job.Cleanup
            image: oev2-job-cleanup
          - path: OE.Job.LiveStream
            image: oev2-job-livestream
          - path: OE.Job.Lookup
            image: oev2-job-lookup
          - path: OE.Translation.Service
            image: oev2-translation-service
          - path: OE.Translation.Job
            image: oev2-translation-job
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-stg" ]]; then
            echo "environment=stg" >> $GITHUB_OUTPUT
            echo "aws_account_id=172065883315" >> $GITHUB_OUTPUT
            echo "aws_region=ap-south-1" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-prd" ]]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
            echo "aws_account_id=525375333516" >> $GITHUB_OUTPUT
            echo "aws_region=ap-east-1" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta
        if: github.event_name == 'release'
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        with:
          images: |
            ${{ steps.env.outputs.aws_account_id }}.dkr.ecr.${{ steps.env.outputs.aws_region }}.amazonaws.com/${{ matrix.app.image }}
          tags: |
            type=sha,event=pr,prefix=pr-sha-
            type=sha,event=branch,prefix={{branch}}-sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure AWS credentials
        if: github.event_name == 'release'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ steps.env.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.aws_account_id }}:role/github-oidc-ecr-push-role
          role-duration-seconds: 3600
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        if: github.event_name == 'release'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

      - name: Build
        if: github.event_name != 'release'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          file: src/OddsEngine/${{ matrix.app.path }}/Dockerfile
          push: false
          tags: image:latest
          build-args: NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}

      - name: Build & Push
        if: github.event_name == 'release'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          file: src/OddsEngine/${{ matrix.app.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}

      - name: Logout to Amazon ECR
        if: github.event_name == 'release'
        run: docker logout ${{ steps.login-ecr.outputs.registry }}

  confluence-history:
    name: Record merge in Confluence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Find merged PR and test result for this commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0]')
          PR_NUM=$(echo "$PR_JSON" | jq -r '.number // empty')
          PR_URL=$(echo "$PR_JSON" | jq -r '.html_url // empty')
          PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha // empty')
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          RESULT="unknown"
          ROWS=""
          if [ -n "$PR_HEAD_SHA" ]; then
            CONCLUSIONS=$(gh api repos/${{ github.repository }}/commits/$PR_HEAD_SHA/check-runs --jq '[.check_runs[] | select(.name | startswith("Test")) | .conclusion] | unique | join(",")')
            ROWS=$(gh api repos/${{ github.repository }}/commits/$PR_HEAD_SHA/check-runs --jq '[.check_runs[] | select(.name | startswith("Test"))] | map("<tr><td>" + .name + "</td><td>" + .conclusion + "</td></tr>") | join("")')
            if [ -n "$CONCLUSIONS" ]; then
              if [ "$CONCLUSIONS" = "success" ]; then
                RESULT="passed"
              else
                RESULT="failed"
              fi
            fi
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"

      - name: Post Confluence comment
        env:
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          BODY=$(jq -n \
            --arg repo "${{ github.event.repository.name }}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg prurl "${{ steps.pr.outputs.url }}" \
            --arg prnum "${{ steps.pr.outputs.number }}" \
            --arg sha "${{ github.sha }}" \
            --arg shaurl "${{ github.event.head_commit.url }}" \
            --arg result "${{ steps.pr.outputs.result }}" \
            --arg rows "${{ steps.pr.outputs.rows }}" \
            '{pageId: "2621767681", body: {representation: "storage", value: ("<p><strong>" + $repo + "</strong> - merged to main - " + $date + " - tests: <strong>" + $result + "</strong> - <a href=\"" + $prurl + "\">PR #" + $prnum + "</a> - commit <a href=\"" + $shaurl + "\">" + ($sha | .[0:7]) + "</a></p>" + (if ($rows | length) > 0 then "<table><tbody><tr><th>Check</th><th>Result</th></tr>" + $rows + "</tbody></table>" else "" end))}}')
          curl -sf -X POST \
            -u "root-aws@song88.com:${CONFLUENCE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "https://song88.atlassian.net/wiki/api/v2/footer-comments"
